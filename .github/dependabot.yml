version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
  # The docs site (website/) only: the libraries have no runtime dependencies. Build-time tooling, never shipped.
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    groups:
      docusaurus:
        patterns:
          - "*"
