name: TypeScript CI

# Runs only when the TypeScript library or the shared spec/vectors change.
on:
  push:
    branches: [main]
    paths:
      - "libs/typescript/**"
      - "spec/**"
      - ".github/workflows/typescript-ci.yml"
  pull_request:
    paths:
      - "libs/typescript/**"
      - "spec/**"
      - ".github/workflows/typescript-ci.yml"

defaults:
  run:
    working-directory: libs/typescript

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26] # 2 LTS versions and the current one
    name: Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: libs/typescript/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      # Conformance against the shared, language-neutral vectors in spec/.
      - run: npm run test:conformance

      - run: npm run build

  # The README declares Bun and Deno support: the unit tests and the conformance vectors run inside each runtime, and
  # the built package must load there. Dependencies come from the npm lockfile, as on Node.
  runtimes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, deno]
    name: ${{ matrix.runtime == 'bun' && 'Bun' || 'Deno' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: libs/typescript/package-lock.json

      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: npm ci

      - run: npm run test:${{ matrix.runtime }}

      - run: npm run build

      - name: Load the built package
        run: |
          if [ "${{ matrix.runtime }}" = bun ]; then
            bun -e "const m = await import('./dist/index.js'); if (typeof m.signIn !== 'function') process.exit(1)"
          else
            deno eval "const m = await import('./dist/index.js'); if (typeof m.signIn !== 'function') Deno.exit(1)"
          fi
