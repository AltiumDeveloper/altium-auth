name: TypeScript CI

# Runs only when the TypeScript library or the shared spec/vectors change.
on:
  push:
    branches: [main]
    paths:
      - "libs/typescript/**"
      - "spec/**"
      - ".github/workflows/typescript-ci.yml"
  pull_request:
    paths:
      - "libs/typescript/**"
      - "spec/**"
      - ".github/workflows/typescript-ci.yml"

defaults:
  run:
    working-directory: libs/typescript

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26] # 2 LTS versions and the current one
    name: Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: libs/typescript/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      # Conformance against the shared, language-neutral vectors in spec/.
      - run: npm run test:conformance

      - run: npm run build
