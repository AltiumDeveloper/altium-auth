name: Python Release

# Publishes libs/python to PyPI when a tag like `py-v0.2.0` is pushed.
# Uses PyPI Trusted Publishing via GitHub OIDC (no API token secret). The project
# must be configured on pypi.org with this repository + workflow as a trusted
# publisher, and a GitHub Environment named `pypi`.
on:
  push:
    tags:
      - "py-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # required for PyPI trusted publishing
    defaults:
      run:
        working-directory: libs/python
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - run: uv sync --extra dev

      - run: uv run ruff check .

      - run: uv run mypy

      # Gate publication on the conformance suite passing.
      - run: uv run pytest

      - run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: libs/python/dist
