name: TypeScript Release

# Publishes libs/typescript to npm when a tag like `ts-v1.1.0` is pushed.
# Uses npm trusted publishing via GitHub OIDC. The package must be configured on
# npmjs.com with this repository and workflow filename as a trusted publisher.
on:
  push:
    tags:
      - "ts-v*"

defaults:
  run:
    working-directory: libs/typescript

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: libs/typescript/package-lock.json

      - run: npm install -g npm@latest

      - run: npm ci

      # prepublishOnly runs clean + lint + test + build before packing.
      - run: npm publish --provenance --access public
